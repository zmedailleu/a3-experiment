<!DOCTYPE html>
<div id="container"></div>
<script type="module">

    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    import * as randomData from "./shared/genRandomData.js";

    const container = document.getElementById("container");

    //test to make sure randomData is working
    console.log(d3);
    let dataPoints = randomData.getData();
    let compareIndexes = randomData.getBarsToCompare(dataPoints);
    console.log(dataPoints);
    console.log(compareIndexes);

    //set dimensions
    const width = 350;
    const height = 900;
    const marginTop = 20;
    const marginRight = 20;
    const marginBottom = 30;
    const marginLeft = 40;

    let pointsSum = d3.sum(dataPoints);
    console.log(pointsSum);

    //save start and end of each bar
    let totalLength = 0;
    const stacked = dataPoints.map((d, i) => {
        const startValue = totalLength;
        totalLength += d;
        return {
            value: d,
            start: startValue,
            end: totalLength,
            index: i
        }
    })


    const x = d3.scaleLinear()
        .domain([0, dataPoints.length])
        .range([marginLeft, width - marginRight]);

    const y = d3.scaleLinear()
        .domain([0, pointsSum])
        .range([height - marginBottom, marginTop]);

    const svg = d3.create("svg")
        .attr("width", width)
        .attr("height", height);

    svg.append("g")
        .attr("transform", `translate(${marginLeft},0)`)
        .call(d3.axisLeft(y).ticks(0).tickFormat(() => ""));

    const barWidth = (width - marginLeft - marginRight);

    svg.append("g")
        .attr("fill", "#7188ad")
        .selectAll()
        .data(stacked)
        .join("rect")
        .attr("stroke", "black")
        .attr("stroke-width", 4)
        .attr("x", marginLeft)
        .attr("y", d => y(d.end))
        .attr("rx", 1)
        .attr("height", d => y(d.start) - y(d.end))
        .attr("width", barWidth)

    //mark points to compare
    svg.append("g")
        .selectAll()
        .data(stacked.filter(d => compareIndexes.includes(d.index)))
        .join("circle")
        .attr("cx", marginLeft + (barWidth / 2))
        .attr("cy", d => y(d.end) + (y(d.start) - y(d.end)) / 2)
        .attr("r", 7)
        .style("fill", "red")

    svg.append("g")
        .selectAll()
        .data(stacked.filter(d => compareIndexes.includes(d.index)))
        .join("circle")
        .attr("cx", marginLeft + (barWidth / 2))
        .attr("cy", d => y(d.end) + (y(d.start) - y(d.end)) / 2)
        .attr("r", 7)
        .style("fill", "red")

    container.append(svg.node());

</script>
