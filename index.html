<!DOCTYPE html>
<div id="container"></div>
<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

import * as randomData from "./shared/genRandomData.js";

const container = document.getElementById("container");

//test to make sure randomData is working
console.log(d3);
let dataPoints = randomData.getData();
console.log(dataPoints);
console.log(randomData.getBarsToCompare(dataPoints));

//set dimensions
const width = 900;
const height = 500;

const pie = d3.pie()
    .sort(null)
    .value(d => d)

const arc = d3.arc()
    .innerRadius(0)
    .outerRadius(height / 2 - 4)

const svg = d3.create("svg")
    .attr("width", width)
    .attr("height", height)
    .attr("viewBox", [-width / 2, -height / 2, width, height]);

svg.append("g")
    .attr("stroke", "white")
    .attr("stroke-width", 8)
    .selectAll()
    .data(pie(dataPoints))
    .join("path")
    .attr("fill", "blue")
    .attr("d", arc);

container.append(svg.node());





</script>
